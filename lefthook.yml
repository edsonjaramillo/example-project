pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    format:
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,mts,cts,tsx}"
      run: bun run typecheck

pre-push:
  commands:
    test:
      run: bun test
